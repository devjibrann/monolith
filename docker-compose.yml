services:
  db:
    image: pgvector/pgvector:pg15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_workspace_development
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6381:6379"

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: bundle exec rails s -p 3000 -b '0.0.0.0'
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/ai_workspace_development
      REDIS_URL: redis://redis:6379/1
      DEVISE_JWT_SECRET_KEY: development-jwt-secret-change-in-production
      CORS_ORIGINS: http://localhost:3001
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_SECRET: development-ai-secret-change-in-production
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
      - ai-service
    env_file:
      - ./backend/.env

  sidekiq:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: bundle exec sidekiq
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/ai_workspace_development
      REDIS_URL: redis://redis:6379/1
      DEVISE_JWT_SECRET_KEY: development-jwt-secret-change-in-production
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_SECRET: development-ai-secret-change-in-production
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
      - ai-service

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local

  ai-service:
    build:
      context: .
      dockerfile: infra/docker/ai-service.Dockerfile
    volumes:
      - ./ai-service:/app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8000
      AI_SERVICE_SECRET: development-ai-secret-change-in-production
      AI_PROVIDER: ${AI_PROVIDER:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-}
      USE_MOCK_EMBEDDINGS: ${USE_MOCK_EMBEDDINGS:-false}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-}
      NVIDIA_CHAT_MODEL: ${NVIDIA_CHAT_MODEL:-}
      NVIDIA_EMBEDDING_MODEL: ${NVIDIA_EMBEDDING_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-}
    depends_on:
      - redis

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  ollama_data:
