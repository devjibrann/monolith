# Copy to lab.conf and edit: cp infra/scripts/lab.conf.example infra/scripts/lab.conf
# Source of truth for teardown-lab.sh and create-lab.sh

export AWS_REGION=us-east-1
export AWS_ACCOUNT_ID=316383776132

# ECS
export ECS_CLUSTER=orgo
export ECS_SERVICE_FRONTEND=orgo-frontend
export ECS_SERVICE_BACKEND=orgo-backend
export ECS_SERVICE_SIDEKIQ=orgo-sidekiq
export ECS_SERVICE_AI=orgo-ai-service

# Task definition families (from infra/ecs/*.json)
export TASK_FAMILY_FRONTEND=orgo-frontend
export TASK_FAMILY_BACKEND=orgo-backend
export TASK_FAMILY_SIDEKIQ=orgo-sidekiq
export TASK_FAMILY_AI=orgo-ai-service

# Networking (Orgo-AI-vpc) — use PUBLIC subnets only (no NAT in this VPC)
export VPC_ID=vpc-0e30fc9d6c7ed5052
export SUBNET_PUBLIC_1=subnet-00004538f84ad4671
export SUBNET_PUBLIC_2=subnet-0aac21064e287a005
export SUBNETS="${SUBNET_PUBLIC_1},${SUBNET_PUBLIC_2}"

export SG_ALB=sg-013dcf89ed907aef6
export SG_ECS_FRONTEND=sg-0cd18174aa20452a0
export SG_ECS_BACKEND=sg-0cb2f0b62969535e1
export SG_ECS_SIDEKIQ=sg-0e4e86beb1381de04
export SG_ECS_AI=sg-04b089c0bce836b0c

# ALB
export ALB_NAME=orgo-alb
export TG_FRONTEND=orgo-frontend-tg
export TG_BACKEND=orgo-backend-tg

# Data stores
export RDS_INSTANCE_ID=ai-service
export REDIS_REPLICATION_GROUP_ID=sidekiq-cache

# Secrets (keep on teardown; update REDIS_URL / AI_SERVICE_URL after recreate)
export SECRET_NAME=monolith

# Frontend image build arg (set to your ALB DNS after first create)
export ALB_DNS=orgo-alb-1794509479.us-east-1.elb.amazonaws.com
export NEXT_PUBLIC_API_URL=http://${ALB_DNS}

# ECR
export ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
export ECR_BACKEND=orgo/backend
export ECR_FRONTEND=orgo/frontend
export ECR_AI=orgo/ai-service

# IAM (created once; scripts skip if roles exist)
export EXECUTION_ROLE=ecsTaskExecutionRole
export TASK_ROLE=monlith-ecs-task
